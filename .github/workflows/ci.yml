name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/injecar_test
      TEST_DATABASE_URL: postgres://injecar_app:ci-app-password-123@localhost:5432/injecar_test
      E2E_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/injecar_e2e
      E2E_DATABASE_URL: postgres://injecar_app:ci-app-password-123@localhost:5432/injecar_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bancos de teste
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database injecar_test"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database injecar_e2e"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
